services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: deepnotchdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d deepnotchdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - /app/.venv  # prevent host .venv from overriding container's
      - server_uploads:/app/uploads
      - server_vectordb:/app/vector_db
      - ./server/private-key.pem:/app/private-key.pem:ro
    env_file: ./server/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./ui
    network_mode: host
    environment:
      NEXT_PUBLIC_BACKEND_URL: "http://127.0.0.1:8080"
      BACKEND_URL: "http://127.0.0.1:8080"
      NEXT_API_BASE_URL: "http://127.0.0.1:8080"
    volumes:
      - ./ui/src:/app/src
      - ./ui/public:/app/public
    depends_on:
      - server

volumes:
  pgdata:
  server_uploads:
  server_vectordb:
